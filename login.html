<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - C'Groovy</title>
  <link rel="stylesheet" href="./style.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="js/main.js"></script>
  </head>
<body>
  <nav class="navbar" id="navbar">
    <div class="navbar-container">
      <a href="index.html" class="logo">C'Groovy</a>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="collection.html">Collection</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
      <a href="register.html" class="cta-button">Get Started</a>
      <div class="mobile-toggle" id="mobileToggle">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </nav>

  <main class="auth-page-container">
    <div class="auth-form-wrapper">
      <div class="auth-form-content">
        <h1>Welcome Back!</h1>
        <p class="auth-subheading">Login to continue your C'Groovy experience.</p>

        <form id="loginForm">
          <div class="form-group">
            <label for="usernameOrEmail">Username or email</label>
            <input type="text" id="usernameOrEmail" name="usernameOrEmail" required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
          </div>

          <div class="form-options">
            <div class="remember-me">
              <input type="checkbox" id="remember" name="remember">
              <label for="remember">Remember me</label>
            </div>
            <a href="#" class="forgot-password">Forgot password?</a>
          </div>

          <button type="submit" class="auth-button">Login to your account</button>

          <div class="social-login-divider">
            <span>Or login with</span>
          </div>

          <div class="social-login-buttons">
            <button type="button" class="social-btn google">G</button>
            <button type="button" class="social-btn twitter">T</button>
            <button type="button" class="social-btn facebook">F</button>
          </div>

          <p class="auth-switch">
            Don't have an account? <a href="register.html">Sign up here</a>
          </p>
        </form>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-content">
      <p>&copy; 2025 C'Groovy. All rights reserved.</p>
      <div class="social-media">
        <a href="https://instagram.com" target="_blank">
          <img src="img/instagram.png" alt="Instagram" class="social-icon">
        </a>
        <a href="https://facebook.com" target="_blank">
          <img src="img/facebook.png" alt="Facebook" class="social-icon">
        </a>
        <a href="https://twitter.com" target="_blank">
          <img src="img/twitter.png" alt="Twitter" class="social-icon">
        </a>
      </div>
    </div>
  </footer>
  <script src="js/validation.js"></script>
  </body>
</html>
